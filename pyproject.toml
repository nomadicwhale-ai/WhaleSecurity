# Repository tooling only: the distributable project lives in engine/.
[tool.pytest.ini_options]
testpaths = ["engine/tests", "tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: ReDoS budgets and performance tests",
  "property: Hypothesis tests",
  "posix: requires POSIX filesystem or home-path semantics",
]

[tool.coverage.run]
branch = true
source = ["whalescan"]
omit = ["*/whalescan/_vendor/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests/fixtures", "tests/golden", "tests/hooks/cases", "evals", "engine/src/whalescan/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
