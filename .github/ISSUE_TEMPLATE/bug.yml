name: Bug report
description: Engine, hook or plugin behavior is incorrect
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use fake secrets and sanitized data only. Security vulnerabilities, hook bypasses and raw secret leaks belong in private reporting (SECURITY.md)."
  - type: textarea
    id: version
    attributes: {label: Version, description: "whalescan version -f json, or installed package version while CLI is unfinished"}
    validations: {required: true}
  - type: textarea
    id: command
    attributes: {label: Command or hook event and minimal reproduction, render: text}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Sanitized -vv log, description: "Review for private paths, hostnames and data before submitting; use 'unavailable' if the CLI is unfinished.", render: text}
    validations: {required: true}
