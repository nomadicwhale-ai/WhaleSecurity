name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  NO_COLOR: "1"
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          ruff check engine/src engine/tests tools tests
          ruff format --check tools tests engine/tests/conftest.py
          python tools/check_pins.py
          python -m pytest tests
          pip-audit --strict --disable-pip -r requirements/ci.txt
      # TODO §8: enable full engine formatting after a separate mechanical cleanup.

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - working-directory: engine
        run: mypy --strict
      - run: mypy --strict --ignore-missing-imports tools

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python: "3.12"
          - os: windows-2025
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          requirements: requirements/test.txt
      - shell: bash
        run: |
          python -m pytest engine/tests tests -m "not slow" --cov=whalescan --cov-branch --cov-report=xml --cov-report=term --cov-fail-under=90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          requirements: requirements/release.txt
      - name: Build wheel and sdist, validate metadata and smoke-import both
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation --sdist --wheel --outdir dist engine
          python -m twine check --strict dist/*
          python tools/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  stdlib-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Empty dependencies, AST import gate and wheel without third-party packages
        shell: bash
        run: |
          python tools/check_stdlib_only.py
          python -m venv --without-pip "$RUNNER_TEMP/stdlib"
          python -m pip --python "$RUNNER_TEMP/stdlib/bin/python" install --no-deps dist/*.whl
          "$RUNNER_TEMP/stdlib/bin/python" -I -c "import importlib.metadata as m; import whalescan; from whalescan import config; from whalescan.report import sarif; assert {d.metadata['Name'] for d in m.distributions()} == {'whalescan'}"

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          requirements: requirements/test.txt
      - name: Reproduce bundle and run rule fixtures with ReDoS checks
        run: |
          python tools/build_bundle.py --check
          whalescan --no-project-config --no-cache rules test --redos

  ci-ok:
    if: always()
    needs: [lint, types, test, build, stdlib-only, rules]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "Required job ended with $result"; exit 1; }
          done
