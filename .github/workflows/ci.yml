name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  NO_COLOR: "1"
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          ruff check engine/src engine/tests tools tests
          ruff format --check tools tests engine/tests/conftest.py
          python tools/check_pins.py
          python -m pytest tests
          pip-audit --strict --disable-pip -r requirements/ci.txt
      # TODO §8: enable full engine formatting after a separate mechanical cleanup.

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - working-directory: engine
        run: mypy --strict
      - run: mypy --strict --ignore-missing-imports tools

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Temporary: CPython 3.14 segfaults on the deep-JSON loader fixture:
    # https://github.com/nomadicwhale-ai/WhaleSecurity/actions/runs/38199614562
    # W4 owns a bounded JSON-nesting preflight; remove this once that fix merges.
    # Only 3.14 is advisory: every other Python/OS leg remains required by ci-ok.
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python: "3.12"
          - os: windows-2025
            python: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          requirements: requirements/test.txt
      - shell: bash
        run: |
          python -m pytest engine/tests tests -m "not slow" --cov=whalescan --cov-branch --cov-report=xml --cov-report=term --cov-fail-under=90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          requirements: requirements/release.txt
      - name: Build wheel and sdist, validate metadata and smoke-import both
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation --sdist --wheel --outdir dist engine
          python -m twine check --strict dist/*
          python tools/check_dist.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  stdlib-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    needs: build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Empty dependencies, AST import gate and wheel without third-party packages
        shell: bash
        run: |
          python tools/check_stdlib_only.py
          python -m venv --without-pip "$RUNNER_TEMP/stdlib"
          python -m pip --python "$RUNNER_TEMP/stdlib/bin/python" install --no-deps dist/*.whl
          "$RUNNER_TEMP/stdlib/bin/python" -I -c "import importlib.metadata as m; import whalescan; from whalescan import config; from whalescan.report import sarif; assert {d.metadata['Name'] for d in m.distributions()} == {'whalescan'}"

  rules:
    # TODO §8: CLI, bundle regeneration, rule metadata/fixtures, ReDoS, hooks,
    # golden/redaction contracts, self-scan/SARIF, import-time and smoke eval gates
    # require the unfinished CLI/rules/hooks/evals. Enable when those land.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "TODO enable engine-dependent quality gates"

  ci-ok:
    if: always()
    needs: [lint, types, test, build, stdlib-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "Required job ended with $result"; exit 1; }
          done
