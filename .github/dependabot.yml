version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    target-branch: main
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    target-branch: main
