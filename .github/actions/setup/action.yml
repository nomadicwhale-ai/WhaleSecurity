name: setup
description: CPython and hash-locked development tooling
inputs:
  python-version:
    description: CPython version
    default: "3.12"
  requirements:
    description: Hash-locked requirements
    default: requirements/ci.txt
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements/*.txt
    - shell: bash
      env:
        REQS: ${{ inputs.requirements }}
      run: |
        python -m pip install --require-hashes --no-deps -r "$REQS"
        python -m pip install --no-deps --no-build-isolation -e engine
