- id: WS-SEC-GH-001
  title: GitHub token (classic PAT, OAuth, app or refresh)
  pack: secrets/vcs
  severity: critical
  confidence: high
  owner: "@whalesecurity/secrets"
  cwe: [CWE-798]
  owasp: [A07]
  applies_to: {kind: [code, iac, ci, agent-config, doc, data]}
  keywords: [ghp_, gho_, ghu_, ghs_, ghr_]
  keywords_case: sensitive
  match:
    regex:
      pattern: '(?P<secret>\bgh[pousr]_[A-Za-z0-9]{36,251}\b)'
      secret_group: secret
  exposure_sensitive: false
  supersedes: [WS-SEC-GEN-001]
  message: A GitHub token is embedded in the file and can grant access to repositories.
  fix: Revoke the token and review the audit log; in CI use GITHUB_TOKEN, OIDC or an installation token.
  references: ["https://github.blog/engineering/platform-security/behind-githubs-new-authentication-token-formats/"]
  fixtures: auto
