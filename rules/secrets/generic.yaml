- id: WS-SEC-PK-001
  title: Private key block (PEM, OpenSSH, PKCS#8, PGP or PuTTY)
  pack: secrets/generic
  severity: critical
  confidence: high
  owner: "@whalesecurity/secrets"
  cwe: [CWE-321, CWE-798]
  owasp: [A07]
  applies_to: {kind: [code, iac, ci, agent-config, doc, data]}
  keywords: ["PRIVATE KEY", "PuTTY-User-Key-File"]
  keywords_case: sensitive
  match:
    multiline:
      # Consume the bounded body too, including incomplete blocks and escaped Python literals.
      # A header-only regex leaks the body through neighboring findings' snippets.
      pattern: |-
        -{5}BEGIN(?P<type>[ A-Z0-9]{0,30}PRIVATE KEY(?: BLOCK)?)-{5}(?:[\s\S]{0,4096}?-{5}END(?P=type)-{5}|(?:(?:\r?\n|\\n)[ \t]{0,16}(?:[A-Za-z0-9+/=]{1,128})?){0,64})|\bPuTTY-User-Key-File-\d:[^\n]{0,128}(?:\r?\n[^\n]{0,128}){0,64}
      max_span_lines: 128
  exposure_sensitive: false
  message: A private key is committed. Anyone with read access to the repo, its forks or CI caches can impersonate its owner.
  fix: Treat it as leaked, revoke or rotate it, purge it from history, and load keys from a secret store or agent at runtime.
  references: ["https://cwe.mitre.org/data/definitions/321.html"]
  fixtures: auto

- id: WS-SEC-DB-002
  title: Credentials embedded in a connection URI
  pack: secrets/generic
  severity: high
  confidence: high
  owner: "@whalesecurity/secrets"
  cwe: [CWE-798]
  owasp: [A07]
  applies_to: {kind: [code, iac, ci, agent-config, doc, data]}
  keywords: ["://"]
  match:
    regex:
      pattern: |-
        \b(?:postgres(?:ql)?|mysql|mariadb|singlestore|singlestoredb|memsql|mongodb(?:\+srv)?|rediss?|amqps?|mssql|sqlserver|clickhouse|cockroachdb|snowflake|oracle|https?|ftp|sftp|ssh)(?:\+[a-z0-9]{1,32})?://(?P<user>[^\s:/@"'`<>]{0,128}):(?!(?:\$\{?[A-Za-z_][A-Za-z0-9_]{0,80}\}?|\$\([A-Za-z_]{1,80}\)|\{\{[^}\n]{0,80}\}\}|<[^>\n]{1,40}>|%\([a-z_]{1,80}\)s|\*{1,256}|[xX]{1,256}|\d{1,5}|(?i:password|passw0rd|pass|changeme|secret|example|redacted))@)(?P<secret>[^\s@/"'`<>]{1,256})@[^\s"'`<>]{1,256}
      secret_group: secret
  exposure_sensitive: false
  supersedes: [WS-SEC-GEN-001]
  message: Connection string for user {{user}} embeds a password. Airflow connections, Celery brokers and SQLAlchemy URLs get logged and echoed, so this spreads.
  fix: Build the DSN at runtime from a secret store and rotate the database user's password.
  references: ["https://cwe.mitre.org/data/definitions/798.html"]
  fixtures: auto

- id: WS-SEC-GEN-001
  title: Generic secret assignment of a high-entropy literal
  pack: secrets/generic
  severity: high
  confidence: medium
  owner: "@whalesecurity/secrets"
  cwe: [CWE-798]
  owasp: [A07]
  applies_to:
    kind: [code, iac, ci, agent-config, data]
    tags_none: [lockfile]
  keywords: [api, secret, token, password, passwd, pwd, credential, private, access, client, auth]
  match:
    any:
      - entropy:
          charset: base64url
          min_len: 16
          max_len: 200
          threshold: 3.5
          min_classes: 2
          context: {keywords: [api_key, apikey, secret, token, password, passwd, pwd, credential, private_key, access_key, client_secret, auth_key], required: true, window_chars: 80}
          exclude_regex:
            - '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$'
            - '^[A-Z][A-Z0-9_]{3,80}$'
      - entropy:
          charset: hex
          min_len: 16
          max_len: 128
          threshold: 3.0
          context: {keywords: [api_key, apikey, secret, token, password, passwd, pwd, credential, private_key, access_key, client_secret, auth_key], required: true, window_chars: 80}
  filters:
    line_not_regex: |-
      (?i)(?:secret|token|key|password)[\w.-]{0,20}?_(?:name|id|arn|path|file|url|uri|type|ttl|length|field|header|md5|sha1|sha256|hash|digest|checksum)["']?[ \t]{0,8}[:=]|[:=>][ \t]{0,8}[rb]?["'](?:https?://|/|\./|~/|arn:|vault:|op://|projects/)
  exposure_sensitive: false
  message: A high-entropy literal assigned in secret context may be a hardcoded credential.
  fix: Move the value to the platform secret store, inject it at runtime and rotate it.
  references: ["https://cwe.mitre.org/data/definitions/798.html"]
  fixtures: auto
