- id: WS-SEC-AWS-001
  title: AWS access key ID
  pack: secrets/cloud
  severity: critical
  confidence: high
  owner: "@whalesecurity/secrets"
  cwe: [CWE-798]
  owasp: [A07]
  applies_to: {kind: [code, iac, ci, agent-config, doc, data]}
  keywords: [AKIA, ASIA, ABIA, ACCA]
  keywords_case: sensitive
  match:
    regex:
      pattern: '(?P<secret>\b(?:AKIA|ASIA|ABIA|ACCA)(?![A-Z2-7]{9}EXAMPLE\b)[A-Z2-7]{16}\b)'
      secret_group: secret
  exposure_sensitive: false
  supersedes: [WS-SEC-GEN-001]
  message: AWS access key ID is embedded in the file.
  fix: Deactivate and rotate in IAM, review CloudTrail, and replace static keys with IAM roles or OIDC.
  references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"]
  fixtures: auto
