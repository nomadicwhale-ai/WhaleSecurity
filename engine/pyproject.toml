[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whalescan"
version = "0.1.0.dev0"
description = "Deterministic security and prompt-injection scanner for code, infrastructure and AI-agent inputs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []                      # stdlib-only core: a hard CI gate
authors = [{ name = "WhaleSecurity contributors" }]
keywords = ["security", "sast", "secrets", "prompt-injection", "sarif", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
adapters = ["pip-audit>=2.7"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "PyYAML>=6", "jsonschema>=4.21"]

[project.scripts]
whalescan = "whalescan.cli:main"

[project.urls]
Homepage = "https://github.com/nomadicwhale-ai/WhaleSecurity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whalescan = ["rules/bundle.json", "report/schemas/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests (ReDoS budgets, perf)"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0917", "PLC0415", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/whalescan"]
